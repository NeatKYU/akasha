name: Prepare weekly promotion

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: knowledge-promotion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6 resolved with gh api on 2026-08-04.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      # actions/setup-node v6 resolved with gh api on 2026-08-04.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Select latest quarantine report
        run: |
          latest=$(git branch -r --sort=-committerdate --format='%(refname:short)' \
            | awk '/origin\/automation\/quarantine-/{print; exit}')
          test -n "$latest"
          git checkout "$latest" -- reports/
      - name: Prepare and validate promotion
        run: |
          npm run prepare-promotion
          npm run validate
      - name: Push human-review promotion branch
        id: push
        run: |
          set -euo pipefail
          branch="promotion/$(date -u +%G-W%V)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ manifest.json
          git commit -m "📝 지식 승격: $(date -u +%G-W%V) 검토 스냅샷 준비"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # workflow는 PR 생성까지만 한다. 승인과 병합은 CODEOWNER가 직접 수행하며,
      # GITHUB_TOKEN에는 review approve를 호출하는 단계를 두지 않는다.
      - name: Open human-review promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/promotion-pr-body.md"
          {
            echo "격리 리포트 \`$(jq -r '.approved_report_date' manifest.json)\`를 main 승격 후보로 준비했습니다."
            echo
            echo "- 이 PR은 \`prepare-weekly-promotion\` workflow가 자동으로 열었습니다."
            echo "- 승인과 병합은 CODEOWNER가 직접 수행합니다. 자동 승인·자동 병합은 없습니다."
            echo "- 병합 후 \`Tag approved snapshot\` workflow에 이 PR 번호와 merge commit SHA를 입력해 \`kb-*\` 태그를 만듭니다."
            unavailable="$(jq -r '.unavailable_sources // [] | .[] | "- `\(.source_id)` (\(.authority)) 수집 실패로 이번 스냅샷에서 제외"' manifest.json)"
            if [ -n "$unavailable" ]; then
              echo
              echo "#### 이번 스냅샷에서 빠진 출처"
              echo
              echo "$unavailable"
            fi
          } > "$body"
          url="$(gh pr create --base main --head "$BRANCH" \
            --title "📝 지식 승격: $(date -u +%G-W%V) 승인 요청" \
            --body-file "$body")"
          {
            echo "### Promotion PR ready for owner review"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
