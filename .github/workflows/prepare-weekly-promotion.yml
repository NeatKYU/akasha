name: Prepare weekly promotion

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: knowledge-promotion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6 resolved with gh api on 2026-08-04.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      # actions/setup-node v6 resolved with gh api on 2026-08-04.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Select latest quarantine report
        run: |
          latest=$(git branch -r --sort=-committerdate --format='%(refname:short)' \
            | awk '/origin\/automation\/quarantine-/{print; exit}')
          test -n "$latest"
          git checkout "$latest" -- reports/
      - name: Prepare and validate promotion
        run: |
          npm run prepare-promotion
          npm run validate
      - name: Open human-approval promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="promotion/$(date -u +%G-W%V)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ manifest.json
          git commit -m "📝 지식 승격: $(date -u +%G-W%V) 검토 스냅샷 준비"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "📝 지식 승격: $(date -u +%G-W%V) 승인 요청" \
            --body "주간 승인 스냅샷입니다. CODEOWNERS 검토 후에만 병합해 주세요."
