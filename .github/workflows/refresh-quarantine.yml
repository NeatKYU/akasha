name: Refresh quarantine

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Optional source limit for a smoke run
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: knowledge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6 resolved with gh api on 2026-08-04.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      # actions/setup-node v6 resolved with gh api on 2026-08-04.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate catalog
        run: npm run validate
      - name: Refresh allowlisted sources
        env:
          REFRESH_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$REFRESH_LIMIT" ]; then
            npm run refresh -- --limit "$REFRESH_LIMIT"
          else
            npm run refresh
          fi
      - name: Validate quarantine report
        run: npm run validate
      - name: Push date-scoped quarantine branch
        run: |
          branch="automation/quarantine-$(date -u +%F)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "📝 지식 격리: $(date -u +%F) 출처 변경 기록"
          git push origin "$branch"
          {
            echo "### Quarantine branch ready"
            echo
            echo "Review branch: \`$branch\`"
            echo "This branch is input for weekly promotion and must not be merged directly."
          } >> "$GITHUB_STEP_SUMMARY"
