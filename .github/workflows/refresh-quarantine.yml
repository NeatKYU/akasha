name: Refresh quarantine

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Optional source limit for a smoke run
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: knowledge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate catalog
        run: npm run validate
      - name: Refresh allowlisted sources
        env:
          REFRESH_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$REFRESH_LIMIT" ]; then
            npm run refresh -- --limit "$REFRESH_LIMIT"
          else
            npm run refresh
          fi
      - name: Validate quarantine report
        run: npm run validate
      - name: Push date-scoped quarantine branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/quarantine-$(date -u +%F)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "📝 지식 격리: $(date -u +%F) 출처 변경 기록"
          git push origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "📝 지식 격리: $(date -u +%F) 외부 문서 점검" \
            --body "자동 수집된 비신뢰 외부 문서 메타데이터입니다. 이 PR은 직접 병합하지 않고 주간 promotion 입력으로만 사용합니다."
