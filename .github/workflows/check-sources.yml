name: Check sources

on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository
        run: npm run validate
      - name: Check whether cited sources changed
        id: check
        run: |
          node scripts/check-sources.mjs | tee /tmp/report.txt
      - name: Summarize
        if: always()
        run: |
          {
            echo "### 출처 변경 확인"
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
