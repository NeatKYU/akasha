name: Tag approved snapshot

on:
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Merged promotion PR number
        required: true
        type: string
      merge_sha:
        description: Merge commit SHA to tag
        required: true
        type: string
      tag_name:
        description: Optional kb-* tag name; defaults to the ISO week and merge SHA prefix
        required: false
        type: string

# pull-requests: write는 태그 생성 뒤 마켓플레이스 핀 갱신 PR을 열 때만 쓴다.
# 이 workflow도 PR 생성까지만 하며, 병합은 CODEOWNER가 직접 한다.
permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify owner-gated promotion provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ inputs.promotion_pr }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail

          test "$GITHUB_ACTOR" = "NeatKYU"
          case "$PROMOTION_PR" in
            ''|*[!0-9]*) echo "promotion_pr must be a number" >&2; exit 1 ;;
          esac
          case "$MERGE_SHA" in
            [a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9]) ;;
            *) echo "merge_sha must be a full lowercase commit SHA" >&2; exit 1 ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PROMOTION_PR}")"
          test "$(jq -r '.merged' <<<"$pr_json")" = "true"
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "main"
          test "$(jq -r '.merge_commit_sha' <<<"$pr_json")" = "$MERGE_SHA"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          reviews_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PROMOTION_PR}/reviews")"
          approval_count="$(
            jq --arg head "$head_sha" '[.[] | select(.state == "APPROVED" and .user.login == "NeatKYU" and .commit_id == $head)] | length' \
              <<<"$reviews_json"
          )"
          test "$approval_count" -ge 1

      # actions/checkout v6 resolved with gh api on 2026-08-04.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ inputs.merge_sha }}
      # actions/setup-node v6 resolved with gh api on 2026-08-04.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate approved snapshot
        run: npm run validate
      - name: Create annotated immutable snapshot tag
        id: create_tag
        env:
          PROMOTION_PR: ${{ inputs.promotion_pr }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          if [ -n "$TAG_NAME" ]; then
            tag="$TAG_NAME"
          else
            tag="kb-$(date -u +%G-W%V)-${MERGE_SHA::7}"
          fi
          case "$tag" in
            kb-[0-9][0-9][0-9][0-9]-W[0-9][0-9]-[a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9]) ;;
            *) echo "tag_name must match kb-YYYY-Www-abcdef0" >&2; exit 1 ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$MERGE_SHA" \
            -m "Approved knowledge snapshot ${tag}" \
            -m "promotion_pr=${PROMOTION_PR}" \
            -m "merge_sha=${MERGE_SHA}" \
            -m "approved_by=NeatKYU"
          git push origin "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # 카탈로그가 main을 추적하면 승인 전 내용이 설치될 수 있으므로, 태그 생성 직후
      # 마켓플레이스를 그 태그에 핀 고정하는 PR을 연다. 병합은 CODEOWNER가 직접 한다.
      - name: Open marketplace pin PR
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          TAG: ${{ steps.create_tag.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin main
          branch="pin/${TAG}"
          git checkout -B "$branch" origin/main
          node scripts/pin-marketplace.mjs "$TAG" "$MERGE_SHA"
          npm run validate
          if git diff --quiet; then
            echo "Marketplace is already pinned to ${TAG}; skipping PR." >&2
            exit 0
          fi
          git add .claude-plugin/marketplace.json .agents/plugins/marketplace.json \
            akasha/.claude-plugin/plugin.json akasha/.codex-plugin/plugin.json
          git commit -m "📌 플러그인: 마켓플레이스를 ${TAG}에 핀 고정"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "📌 플러그인: 마켓플레이스를 ${TAG}에 핀 고정" \
            --body "$(printf '승인 태그 %s (%s)에 마켓플레이스 카탈로그를 핀 고정합니다.\n\n- Claude Code: git-subdir ref/sha 핀, version 갱신\n- Codex: git-subdir ref 핀\n- akasha plugin.json version 갱신 (다음 태그 스냅샷에 반영)\n\n자동 생성: tag-approved-snapshot workflow' "$TAG" "$MERGE_SHA")"
