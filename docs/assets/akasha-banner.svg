<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AKASHA — 역할 기반 승인 지식베이스">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#161a3c"/>
      <stop offset="1" stop-color="#2b1e4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- 별: 기록고 위의 밤하늘 -->
  <g fill="#e0e7ff">
    <circle cx="88" cy="52" r="1.6" opacity="0.9"/>
    <circle cx="204" cy="30" r="1.1" opacity="0.55"/>
    <circle cx="356" cy="64" r="1.3" opacity="0.7"/>
    <circle cx="486" cy="36" r="1.0" opacity="0.5"/>
    <circle cx="618" cy="70" r="1.5" opacity="0.75"/>
    <circle cx="742" cy="42" r="1.1" opacity="0.55"/>
    <circle cx="864" cy="82" r="1.7" opacity="0.85"/>
    <circle cx="962" cy="34" r="1.2" opacity="0.6"/>
    <circle cx="1074" cy="66" r="1.4" opacity="0.7"/>
    <circle cx="1152" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="1042" cy="188" r="1.3" opacity="0.6"/>
    <circle cx="928" cy="236" r="1.5" opacity="0.7"/>
    <circle cx="700" cy="252" r="1.1" opacity="0.5"/>
    <circle cx="540" cy="222" r="1.2" opacity="0.55"/>
    <circle cx="120" cy="238" r="1.4" opacity="0.65"/>
    <circle cx="44" cy="150" r="1.2" opacity="0.55"/>
  </g>

  <!-- 엠블럼: 겹겹이 쌓인 기록의 층 -->
  <circle cx="205" cy="158" r="128" fill="url(#glow)"/>
  <g transform="translate(205,186)" fill="none" stroke="url(#accent)" stroke-linecap="round">
    <ellipse rx="74" ry="24" stroke-width="2.6" opacity="0.95"/>
    <ellipse rx="74" ry="24" cy="-24" stroke-width="2.1" opacity="0.7"/>
    <ellipse rx="74" ry="24" cy="-48" stroke-width="1.6" opacity="0.45"/>
    <ellipse rx="74" ry="24" cy="-72" stroke-width="1.2" opacity="0.25"/>
  </g>
  <!-- 승인된 기록 하나가 올라가는 점 -->
  <circle cx="205" cy="84" r="4.5" fill="#f0abfc"/>
  <line x1="205" y1="92" x2="205" y2="128" stroke="url(#accent)" stroke-width="1.4" opacity="0.6" stroke-dasharray="2 5"/>

  <!-- 타이틀 -->
  <text x="368" y="148" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="16" fill="#f5f3ff">AKASHA</text>
  <text x="372" y="192" font-family="'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="21" letter-spacing="1.5" fill="#c4b5fd">아카샤 — 역할 기반 승인 지식베이스</text>
  <text x="372" y="230" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#8b93c9">quarantine → promotion PR → immutable tag → agents</text>

  <!-- 하단 액센트 -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
